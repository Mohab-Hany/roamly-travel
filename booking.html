<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Your Booking — Roamly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/booking.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="booking">
<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Roam<em>ly</em></a>
    <nav class="nav-links" id="nav-links">
      <a href="index.html" data-page="home">Home</a>
      <a href="destinations.html" data-page="destinations">Destinations</a>
      <a href="hotels.html" data-page="hotels">Hotels</a>
      <a href="favorites.html" data-page="favorites">Favorites</a>
      <a href="profile.html" data-page="profile">Profile</a>
    </nav>
    <div class="header-actions">
      <a href="favorites.html" class="icon-link" aria-label="Favorites">♡<span class="count" data-favorites-count>0</span></a>
      <a href="hotels.html" class="btn btn-primary btn-sm">Book Now</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="main">
  <div id="booking-root">
    <div class="container" style="padding-block:var(--space-7)">
      <div class="booking-steps">
        <div class="booking-step"><span class="dot">1</span> Choose Hotel</div>
        <div class="booking-step is-active"><span class="dot">2</span> Your Details</div>
        <div class="booking-step"><span class="dot">3</span> Confirmation</div>
      </div>

      <div class="booking-layout">
        <div>
          <div class="form-card">
            <h3>Personal Information</h3>
            <form id="booking-form">
              <div class="form-grid">
                <div class="field">
                  <label for="firstName">First Name</label>
                  <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="field">
                  <label for="lastName">Last Name</label>
                  <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="field full">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" required>
                </div>
                <div class="field full">
                  <label for="phone">Phone</label>
                  <input type="tel" id="phone" name="phone" required>
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-block" style="margin-top:var(--space-5)">Confirm Booking</button>
            </form>
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-card__hotel">
            <img id="summary-hotel-img" src="" alt="">
            <div>
              <h4 id="summary-hotel-name"></h4>
              <span id="summary-hotel-location"></span>
            </div>
          </div>
          <div class="price-line"><span>Dates</span><span id="summary-dates"></span></div>
          <div class="price-line"><span>Guests</span><span id="summary-guests"></span></div>
          <div class="perforation"></div>
          <div class="price-line"><span id="summary-price-per-night"></span></div>
          <div class="price-line"><span>Subtotal</span><span id="summary-subtotal"></span></div>
          <div class="price-line"><span>Taxes &amp; fees</span><span id="summary-taxes"></span></div>
          <div class="price-line total"><span>Total</span><span id="summary-total"></span></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <span>© 2026 Roamly. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/navigation.js"></script>
<script src="js/main.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
