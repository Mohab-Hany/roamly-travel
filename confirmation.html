<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed — Roamly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/booking.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="confirmation">
<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Roam<em>ly</em></a>
    <nav class="nav-links" id="nav-links">
      <a href="index.html" data-page="home">Home</a>
      <a href="destinations.html" data-page="destinations">Destinations</a>
      <a href="hotels.html" data-page="hotels">Hotels</a>
      <a href="favorites.html" data-page="favorites">Favorites</a>
      <a href="profile.html" data-page="profile">Profile</a>
    </nav>
    <div class="header-actions">
      <a href="favorites.html" class="icon-link" aria-label="Favorites">♡<span class="count" data-favorites-count>0</span></a>
      <a href="hotels.html" class="btn btn-primary btn-sm">Book Now</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="main">
  <div id="confirmation-root" class="container">
    <div class="confirmation-wrap">
      <div class="confirmation-icon">🎉</div>
      <h1>Booking Confirmed!</h1>
      <p>Thank you for booking with Roamly, <span id="confirm-name"></span>.</p>
      <div class="confirmation-id">Booking ID: <span id="confirm-id"></span></div>

      <div class="confirm-details">
        <div class="price-line"><span>Hotel</span><span id="confirm-hotel"></span></div>
        <div class="price-line"><span>Location</span><span id="confirm-location"></span></div>
        <div class="price-line"><span>Dates</span><span id="confirm-dates"></span></div>
        <div class="price-line"><span>Guests</span><span id="confirm-guests"></span></div>
        <div class="price-line total"><span>Total Paid</span><span id="confirm-total"></span></div>
      </div>

      <div class="confirm-actions">
        <a href="profile.html" class="btn btn-primary">View My Bookings</a>
        <a href="index.html" class="btn btn-secondary">Back To Home</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <span>© 2026 Roamly. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/navigation.js"></script>
<script src="js/main.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
